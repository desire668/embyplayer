# EmbyPlayer 中文右键菜单（基于 mpv 官方 etc/menu.conf 汉化）
# 放置于 mpv.exe 同目录的 portable_config 下即可自动生效，替换英文默认菜单。
# 格式：每行一个菜单项，字段用 Tab 分隔：显示文字<Tab>命令<Tab>checked=/disabled=/hidden=条件；
# 无命令的行为子菜单，子项用前导 Tab 缩进；空行为分隔线。

播放	cycle pause		hidden=not pause and not idle_active	disabled=idle_active
暂停	cycle pause		hidden=idle_active or pause
停止	stop			hidden=idle ~= true						disabled=idle_active
打开
	剪贴板		update-clipboard text; loadfile ${clipboard/text}; show-text '+ ${clipboard/text}'
	播放历史		script-binding select/select-watch-history
	稍后观看	script-binding select/select-watch-later
播放列表	$playlist
轨道	$tracks
播放控制
	图片显示时长	hidden=not p["current-tracks/video/image"] or p["current-tracks/audio"]
		1 秒		set image-display-duration 1		checked=image_display_duration == 1
		2 秒		set image-display-duration 2		checked=image_display_duration == 2
		5 秒		set image-display-duration 5		checked=image_display_duration == 5
		10 秒		set image-display-duration 10		checked=image_display_duration == 10
		无限		set image-display-duration inf		checked=image_display_duration == math.huge
	倍速
		25%		set speed 0.25		checked=speed == 0.25
		50%		set speed 0.50		checked=speed == 0.50
		75%		set speed 0.75		checked=speed == 0.75
		100%	set speed 1			checked=speed == 1
		125%	set speed 1.25		checked=speed == 1.25
		150%	set speed 1.50		checked=speed == 1.50
		175%	set speed 1.75		checked=speed == 1.75
		200%	set speed 2			checked=speed == 2
		400%	set speed 4			checked=speed == 4
		800%	set speed 8			checked=speed == 8
	设置/清除 A-B 循环点	ab-loop
	单文件循环		cycle-values loop-file inf no		checked=loop_file == "inf"
	列表循环	cycle-values loop-playlist inf no	checked=loop_playlist == "inf"
	快进 10 秒	seek  10	hidden=p["current-tracks/video/image"] and not p["current-tracks/audio"]
	后退 10 秒	seek -10	hidden=p["current-tracks/video/image"] and not p["current-tracks/audio"]
	快进 10 分钟	seek  600	hidden=p["current-tracks/video/image"] and not p["current-tracks/audio"]
	后退 10 分钟	seek -600	hidden=p["current-tracks/video/image"] and not p["current-tracks/audio"]
	重新加载		set file-local-options/start ${=time-pos}; playlist-play-index current yes; show-text "正在重新加载当前文件..."
	下一个文件		playlist-next	disabled=playlist_count < 2
	上一个文件	playlist-prev	disabled=playlist_count < 2
	下一个子列表		playlist-next-playlist	disabled=playlist_count < 2
	上一个子列表	playlist-prev-playlist	disabled=playlist_count < 2
	随机排序	playlist-shuffle
	恢复排序	playlist-unshuffle
章节			$chapters
版本/标题	$editions
视频
	轨道	$video-tracks
	填满		no-osd cycle-values panscan 0 1; no-osd set video-unscaled no; no-osd set video-zoom 0		checked=panscan == 1
	拉伸	no-osd cycle keepaspect																		checked=not keepaspect
	不缩放	no-osd cycle-values video-unscaled yes no; no-osd set video-zoom 0; no-osd set panscan 0	checked=video_unscaled
	缩放
		50%	set video-zoom -1	checked=video_zoom == -1
		100%	set video-zoom  0	checked=video_zoom == 0
		200%	set video-zoom  1	checked=video_zoom == 1
	画面比例
		16:9		set video-aspect-override 16:9		checked=math.abs(video_aspect_override - 16/9) < 1e-12
		4:3		set video-aspect-override 4:3		checked=math.abs(video_aspect_override - 4/3) < 1e-12
		2.35:1		set video-aspect-override 2.35:1	checked=video_aspect_override == 2.35
		默认	set video-aspect-override no		checked=video_aspect_override == -2
	画面居中		no-osd set video-pan-x 0; no-osd set video-pan-y 0; no-osd set video-align-x 0; no-osd set video-align-y 0		disabled=video_pan_x == 0 and video_pan_y == 0 and video_align_x == 0 and video_align_y == 0
	顺时针旋转			cycle-values video-rotate 90 180 270 0
	逆时针旋转	cycle-values video-rotate 270 180 90 0
	去色带			cycle deband		checked=deband
	反交错	cycle deinterlace	checked=deinterlace_active
	截图						screenshot			disabled=not p["current-tracks/video"]
	截图（无字幕）	screenshot video	disabled=not p["current-tracks/video"]
音频
	音轨		$audio-tracks
	输出设备	$audio-devices
	声道
		自动		set audio-channels auto-safe	checked=audio_channels == "auto-safe"
		立体声		set audio-channels stereo		checked=audio_channels == "stereo"
		单声道		set audio-channels mono			checked=audio_channels == "mono"
	增大音量	add volume  2
	减小音量	add volume -2
	静音				cycle mute		checked=mute
	音频延迟 +0.1		add audio-delay  0.1
	音频延迟 -0.1		add audio-delay -0.1
字幕
	字幕轨		$sub-tracks
	显示/隐藏字幕	cycle sub-visibility	checked=sub_visibility
	字幕延迟 +0.1		add sub-delay  0.1
	字幕延迟 -0.1		add sub-delay -0.1
	字幕放大		add sub-scale  0.1
	字幕缩小		add sub-scale -0.1
	选定字幕行	script-binding select/select-subtitle-line	disabled=not sid or p["current-tracks/sub/codec"] == "dvb_subtitle" or p["current-tracks/sub/codec"] == "dvd_subtitle" or p["current-tracks/sub/codec"] == "hdmv_pgs_subtitle"
	第二字幕
		字幕轨		$secondary-sub-tracks
		显示/隐藏	cycle secondary-sub-visibility	checked=secondary_sub_visibility
		延迟 +0.1		add secondary-sub-delay  0.1
		延迟 -0.1		add secondary-sub-delay -0.1
		选定字幕行	script-binding select/select-secondary-subtitle-line	disabled=not secondary_sid or p["current-tracks/sub2/codec"] == "dvb_subtitle" or p["current-tracks/sub2/codec"] == "dvd_subtitle" or p["current-tracks/sub2/codec"] == "hdmv_pgs_subtitle"
窗口
	全屏		cycle fullscreen	checked=fullscreen
	边框			cycle border		checked=border
	标题栏		cycle title-bar		checked=title_bar
	窗口置顶	cycle ontop			checked=ontop
	窗口缩放
		50%		set window-scale 0.5	checked=math.abs(get("current-window-scale", 0) - 0.5) < 0.1
		100%	set window-scale 1		checked=math.abs(get("current-window-scale", 0) - 1) < 0.1
		200%	set window-scale 2		checked=math.abs(get("current-window-scale", 0) - 2) < 0.1
		300%	set window-scale 3		checked=math.abs(get("current-window-scale", 0) - 3) < 0.1
	截图（含窗口）	screenshot window
查看
	播放统计信息	script-binding stats/display-page-1-toggle
	文件信息		script-binding stats/display-page-5-toggle
	快捷键列表			script-binding stats/display-page-4-toggle
	时间 OSD				no-osd cycle-values osd-level 3 1	checked=osd_level == 3
	切换控制栏显示	script-binding osc/visibility
	控制栏布局
		底部栏			no-osd change-list script-opts append osc-layout=bottombar
		顶部栏			no-osd change-list script-opts append osc-layout=topbar
		悬浮			no-osd change-list script-opts append osc-layout=floating
		盒形				no-osd change-list script-opts append osc-layout=box
		纤细盒形			no-osd change-list script-opts append osc-layout=slimbox
		纤细底部栏	no-osd change-list script-opts append osc-layout=slimbottombar	hidden=not p["current-tracks/video/image"] or p["current-tracks/audio"]
		纤细顶部栏		no-osd change-list script-opts append osc-layout=slimtopbar		hidden=not p["current-tracks/video/image"] or p["current-tracks/audio"]
配置方案	$profiles
工具
	复制文件路径		set clipboard/text ${path}			disabled=idle_active
	复制字幕文本	set clipboard/text ${sub-text}		disabled=not sid or p["current-tracks/sub/codec"] == "dvd_subtitle" or p["current-tracks/sub/codec"] == "hdmv_pgs_subtitle"
	复制标题		set clipboard/text ${media-title}	disabled=idle_active
	硬件解码	cycle-values hwdec no auto	checked=hwdec_current and hwdec_current ~= "no"	disabled=p["current-tracks/video/image"] ~= false
	快捷键			script-binding select/select-binding
	全部属性			script-binding select/show-properties
	控制台			script-binding commands/open
	编辑配置文件		script-binding select/edit-config-file
	编辑快捷键		script-binding select/edit-input-conf
	在线文档	script-binding select/open-docs
	社区支持				script-binding select/open-chat
退出					quit
退出并保存进度	quit-watch-later	hidden=save_position_on_quit
