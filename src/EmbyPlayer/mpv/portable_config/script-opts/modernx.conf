# EmbyPlayer —— ModernX OSC 配置
# 脚本：scripts/modernx.lua（https://github.com/diana7127/ModernX）
# 图标字体：fonts/Material-Design-Iconic-{Font,Round}.ttf
# 注意：ModernX 的选项解析不认识行内注释，注释必须独立成行

# ---------- 显示时机 ----------
# 只在鼠标移到窗口底部（无边框时顶部标题条也算）时才显示，鼠标在画面中间移动不会弹出
bottomhover=yes
minmousemove=2
hidetimeout=1600
fadeduration=150
showonpause=yes

# ---------- 显示范围 ----------
# mpv 由本应用以 --border=no 启动，沿用原来内置 OSC 的做法保留窗口控制按钮
windowcontrols=yes
showwindowed=yes
showfullscreen=yes
# 应用有自己的窗口标题栏，不再让 ModernX 画一条窗口标题
showwindowtitle=no
titleBarStrip=no

# ---------- 标题与文字 ----------
language=chs
showtitle=yes
dynamictitle=yes
title=${media-title}
font=Microsoft YaHei
titlefontsize=24
timefontsize=18
chapterformat=章节：%s

# ---------- 配色（ASS 颜色为 BGR 顺序，与 CSS 的 #RRGGBB 相反） ----------
# osc_color=#101014 / seekbarfg=#9BB0FF
osc_color=141010
OSCfadealpha=150
boxalpha=70
seekbarfg_color=FFB09B
seekbarbg_color=FFFFFF
seekbarkeyframes=yes
seekrange=yes
iconstyle=round
hovereffect=yes
thumbnailborder=2
# OSC 出现时把字幕/弹幕抬上去，别被压住
raisesubswithosc=yes

# ---------- 按钮 ----------
timetotal=no
timems=no
volumecontrol=yes
# 快进/快退合并进章节按钮，控制条更窄
compactmode=yes
jumpamount=10
showskip=yes
showjump=yes
showloop=no
showontop=no
showinfo=no
downloadbutton=no
welcomescreen=no
persistentprogress=no
