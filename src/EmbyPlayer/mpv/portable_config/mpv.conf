# EmbyPlayer mpv 基础配置
# OSD/菜单文字使用微软雅黑，保证中文正常显示（默认字体缺 CJK 字形会显示方框）
osd-font=Microsoft YaHei
osd-font-size=32

# OSC 交给 ModernX（scripts/modernx.lua），必须关掉 mpv 自带的 OSC，否则两个界面会叠在一起
osc=no
# ModernX 的按钮图标来自 fonts/ 下的两款 Material Design 图标字体，显式挂上字体目录确保一定找得到
osd-fonts-dir=~~/fonts

# 启用右键菜单（菜单内容见同目录 menu.conf）
# 写在这里而不是命令行：老版本 mpv 不认识这个选项时只会报一行错，不会导致播放失败
load-context-menu=yes
